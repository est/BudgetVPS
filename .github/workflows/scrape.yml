name: Scrape VPS & Deploy Pages

on:
  schedule:
    # 每天 UTC 02:23（北京时间 10:23）
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "templates/**"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Ensure Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Ensure Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run --help >/dev/null

      - name: Crawl & build
        env:
          # 可选：如果 CI 出口 IP 被 Cloudflare 拦得太狠，可以在这里塞一个手动取得的 clearance
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        # 无头 Chrome 过不了 CF 的 managed challenge，必须用 xvfb 起有头浏览器
        run: xvfb-run -a python -m scraper.main

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 重新对齐到远端最新提交，避免和上一次定时任务的数据 commit 冲突
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed "origin/${GITHUB_REF_NAME}"
          git add data
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: update vps data $(date -u +%F)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
        with:
          # 首次运行自动开启 Pages（Settings → Pages 不用手动点）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
